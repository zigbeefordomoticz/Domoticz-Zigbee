[tool.pytest.ini_options]
# Python 3.11 MagicMock auto-creates AsyncMock for async magic methods
# (__aenter__, __aexit__, …). The GC fires a RuntimeWarning when those
# internal coroutines are collected mid-test. This is a known unittest.mock
# quirk, not a real unawaited-coroutine bug in the tests.
filterwarnings = [
    "ignore::RuntimeWarning:unittest.mock",
]

[tool.black]
line-length = 160

[tool.flake8]
max-line-length = 160
builtins = "Devices,Parameters,Connection"
ignore = [
    "E501",
    "E302",
    "E201", "E202", "E231", "E503", "E265", "E225", "E123", "E271", "E303", "E125", "E117", "E305", "E203",
    "F401", "F841",
    "W292", "W293", "W503", "W291"
]
per-file-ignores = { "DevicesModules/custom_GammaTroniques.py" = ["E221", "E241"] }

