name: Claude Issue Triage

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            A new issue was opened on this Zigbee plugin for Domoticz.
            
            Triage this issue concisely. Read only the few files most relevant
            to the problem — do not explore the whole codebase. Keep your
            comment short: classification, likely root cause with file/line,
            and 1-2 next steps. 
            At most: classify it, give a one-paragraph likely-cause hypothesis,
            name the 1-2 most relevant files (a quick grep is fine), and list
            any missing info needed from the reporter. Keep it short.
            If deep analysis is needed, say so and stop — a maintainer can
            invoke @claude for a full investigation.
            If the issue body contains long debug logs,
            summarize them rather than re-reading repeatedly.
            - Title: ${{ github.event.issue.title }}
            - Body: ${{ github.event.issue.body }}
            - Issue #: ${{ github.event.issue.number }}

          claude_args: |
            --max-turns 8
            --model claude-sonnet-4-6
