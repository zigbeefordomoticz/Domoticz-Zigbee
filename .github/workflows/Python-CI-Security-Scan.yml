name: Python CI & Security Scan

on:
  push:
    branches: ["**"]
    paths:
      - "**/*.py"
  pull_request:
    branches: ["**"]
    paths:
      - "**/*.py"
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed
  schedule:
    - cron: '44 10 * * 6'  # Weekly run for CodeQL

jobs:
  python_quality:
    name: Python Quality Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13, 3.14]  # Multi-version testing
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: pip-cache-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            pip-cache-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit black codespell flake8 isort mypy pytest pyupgrade

      - name: Bandit security scan
        run: bandit -r .

      #- name: Black code style check
      #  run: black --check .

      #- name: Codespell
      #  run: codespell --quiet-level=2 --skip="./www"

      - name: Flake8 linting
        run: flake8 . --builtins=Devices,Parameters,Connection --count --select=E9,F63,F7,F82 --show-source --statistics

      #- name: Isort import check
      #  run: isort --check-only --profile black .

      #- name: Mypy type check
      #  run: mypy --ignore-missing-imports .

      - name: Run pytest
        run: pytest .

      #- name: Run doctests
      #  run: pytest --doctest-modules .

      - name: Upgrade Python syntax with pyupgrade
        run: |
          shopt -s globstar
          pyupgrade --py36-plus **/*.py || true

  codeql_analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    needs: python_quality  # Run after Python quality checks
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['python']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Cache CodeQL database
        uses: actions/cache@v3
        with:
          path: .github/codeql/databases
          key: codeql-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            codeql-${{ runner.os }}-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

