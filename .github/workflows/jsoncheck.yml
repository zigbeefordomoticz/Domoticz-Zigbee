name: JSON Syntax Check

on:
  push:
    paths:
      - '**/*.json'
  pull_request:
    paths:
      - '**/*.json'

jobs:
  json_check:
    name: Validate JSON files
    runs-on: ubuntu-latest

    steps:
      # Checkout repository with full history and all branches
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          fetch-all: true

      # Run Super-Linter
      - name: Lint JSON files
        uses: github/super-linter@v6
        env:
          VALIDATE_JSON: true
          DEFAULT_BRANCH: main        # ensure linter knows the default branch
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

