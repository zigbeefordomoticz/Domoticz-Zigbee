name: Stale

# Workflow triggers:
# - Scheduled: every hour
# - Manual trigger
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      # -----------------------------
      # General stale policy for issues & PRs
      # - Issues/PRs inactive for 60 days
      # - Exempts: pinned, security, no-stale, help-wanted
      # - Closes after 7 days of being stale
      # -----------------------------
      - name: 60-day stale policy for issues & PRs
        uses: actions/stale@v4
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 7
          operations-per-run: 150
          remove-stale-when-updated: true
          stale-issue-label: "stale"
          exempt-issue-labels: "pinned,security,no-stale,help-wanted"
          stale-issue-message: >
            There hasn't been any activity on this issue recently. Due to the
            high number of incoming GitHub notifications, we have to clean some
            of the old issues, as many of them have already been resolved with
            the latest updates.
            Please make sure to update to the latest version and check if that
            solves the issue. Let us know if that works for you by adding a
            comment 👍
            This issue has now been marked as stale and will be closed if no
            further activity occurs. Thank you for your contributions.
          stale-pr-label: "stale"
          exempt-pr-labels: "no-stale"
          stale-pr-message: >
            There hasn't been any activity on this pull request recently. This
            pull request has been automatically marked as stale because of that
            and will be closed if no further activity occurs within 7 days.
            Thank you for your contributions.

      # -----------------------------
      # Special stale policy for "needs-more-information" issues
      # - Only affects issues with label "needs-more-information"
      # - Stale after 30 days
      # - Closes after 7 days
      # - Does not affect PRs
      # -----------------------------
      - name: 30-day stale policy for "needs-more-information" issues
        uses: actions/stale@v4
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          only-labels: "needs-more-information"
          days-before-stale: 30
          days-before-close: 7
          # -1 disables closing PRs in this step
          days-before-pr-close: -1
          operations-per-run: 50
          remove-stale-when-updated: true
          stale-issue-label: "stale"
          exempt-issue-labels: "pinned,security,no-stale,help-wanted"
          stale-issue-message: >
            There hasn't been any activity on this issue recently. Due to the
            high number of incoming GitHub notifications, we have to clean some
            of the old issues, as many of them have already been resolved with
            the latest updates.
            Please make sure to update to the latest version and check if that
            solves the issue. Let us know if that works for you by adding a
            comment 👍
            This issue has now been marked as stale and will be closed if no
            further activity occurs. Thank you for your contributions.

