name: Stale

# Workflow triggers:
# - Scheduled: daily at 01:30 UTC
# - Manual trigger
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  actions: write   # actions/stale >= v9 keeps its state in the Actions cache

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      # -----------------------------
      # General stale policy for issues & PRs
      # - Issues/PRs inactive for 60 days
      # - Exempt issues: no-stale, pinned, enhancement, Help Needed
      # - Exempt PRs: no-stale, do-not-merge, and all drafts
      # - Closes after 7 days of being stale
      # -----------------------------
      - name: 60-day stale policy for issues & PRs
        uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 7
          operations-per-run: 150
          remove-stale-when-updated: true
          stale-issue-label: "stale"
          exempt-issue-labels: "no-stale,pinned,enhancement,Help Needed"
          stale-issue-message: >
            There hasn't been any activity on this issue recently. Due to the
            high number of incoming GitHub notifications, we have to clean some
            of the old issues, as many of them have already been resolved with
            the latest updates.
            Please make sure to update to the latest version and check if that
            solves the issue. Let us know if that works for you by adding a
            comment 👍
            This issue has now been marked as stale and will be closed in 7 days
            if no further activity occurs. A maintainer can add the `no-stale`
            label to keep it open. Thank you for your contributions.
          stale-pr-label: "stale"
          exempt-pr-labels: "no-stale,do-not-merge"
          exempt-draft-pr: true
          stale-pr-message: >
            There hasn't been any activity on this pull request recently. This
            pull request has been automatically marked as stale because of that
            and will be closed if no further activity occurs within 7 days.
            A maintainer can add the `no-stale` label to keep it open.
            Thank you for your contributions.

      # -----------------------------
      # Special stale policy for "needs-more-information" issues
      # - Only affects issues with label "needs-more-information"
      # - Stale after 30 days
      # - Closes after 7 days
      # - Does not affect PRs
      # -----------------------------
      - name: 30-day stale policy for "needs-more-information" issues
        uses: actions/stale@v11
        with:
          only-labels: "needs-more-information"
          days-before-stale: 30
          days-before-close: 7
          # -1 disables marking and closing PRs in this step
          days-before-pr-stale: -1
          days-before-pr-close: -1
          operations-per-run: 50
          remove-stale-when-updated: true
          stale-issue-label: "stale"
          exempt-issue-labels: "no-stale,pinned,enhancement,Help Needed"
          stale-issue-message: >
            This issue is waiting for more information and has had no activity
            for 30 days. It will be closed in 7 days if no further information
            is provided. A maintainer can add the `no-stale` label to keep it
            open. Thank you for your contributions.
